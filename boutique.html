<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Boutique — Âmes Nomades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/assets/img/site.webmanifest">
  <link rel="icon" href="/assets/img/favicon.ico">

  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 24px;
      margin-top: 40px;
    }
    .shop-card {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.55);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .shop-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(0,0,0,0.06);
    }
    .shop-image {
      width: 100%;
      height: 240px;
      object-fit: cover;
      background: var(--line);
    }
    .shop-content {
      padding: 20px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .shop-title {
      font-family: 'SegoCustom', serif;
      font-size: 22px;
      margin: 0 0 10px 0;
      color: var(--text);
    }
    .shop-desc {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 20px;
      flex: 1;
    }
    .shop-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: auto;
    }
    .shop-price {
      font-size: 18px;
      font-weight: 600;
    }
  </style>
</head>

<body class="on-light">

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="/index.html">
        <img src="/assets/img/logo-ames-nomades.png" alt="Âmes Nomades">
        <span>ÂmesNomades</span>
      </a>
      <div class="nav-links nav-links-desktop">
        <a href="/index.html#retraites">Retraites</a>
        <a href="/boutique.html" class="active">Boutique</a>
        <a href="/compte.html">Compte</a>
      </div>
    </div>
  </header>

  <main class="band cream" style="min-height: 80vh;">
    <div class="container" style="padding: calc(var(--navH) + 60px) 0 80px;">
      
      <div style="text-align:center; max-width:600px; margin:0 auto;">
        <h1 style="font-family:'SegoCustom'; font-size:42px; margin:0;">Boutique</h1>
        <p style="color:var(--muted); margin-top:16px; font-size:16px; line-height:1.6;">
          Découvre notre sélection de produits exclusifs pour t'accompagner dans ta pratique et ton quotidien.
        </p>
      </div>

      <div class="shop-grid" id="publicShopGrid">
        <div style="text-align:center; grid-column:1/-1; padding:40px; color:var(--muted);">
          Chargement de la boutique...
        </div>
      </div>

    </div>
  </main>

  <footer class="band cream footer-dark" style="border-top:1px solid var(--line);">
    <div class="container footer">
      <div class="footer-row">
        <div class="footer-brand">
          <img src="assets/img/logo-ames-nomades.png" alt="Âmes Nomades">
          <div style="font-family:'SegoCustom'; font-weight:500;">ÂmesNomades</div>
        </div>

        <div class="footer-social">
          <a class="icon-btn light" href="https://instagram.com/amesnomades_retreat" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
              <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9A5.5 5.5 0 0 1 16.5 22h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2Z" stroke="currentColor" stroke-width="1.7"/>
              <path d="M12 16.2A4.2 4.2 0 1 0 12 7.8a4.2 4.2 0 0 0 0 8.4Z" stroke="currentColor" stroke-width="1.7"/>
              <path d="M17.6 6.4h.01" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </a>

          <a class="icon-btn light" href="https://www.facebook.com/share/1bLsFzNTCz/?mibextid=wwXIfr" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
            <svg class="icon" viewBox="0 0 24 24" fill="none">
              <path d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v3H7v3h3v6h3v-6h3l1-3h-4v-3c0-.6.4-1 1-1Z" fill="currentColor"/>
            </svg>
          </a>

          <a class="icon-btn light" href="https://www.tiktok.com/@amesnomades_retreat" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
            <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.5 3v13.1c0 1.4-1.2 2.6-2.6 2.6s-2.6-1.2-2.6-2.6 1.2-2.6 2.6-2.6v-2.6a5.2 5.2 0 1 0 5.2 5.2V7.1a7.3 7.3 0 0 0 3.8 1.1V5.5A4.6 4.6 0 0 1 15 3h-2.5z"/>
            </svg>
          </a>

          <a href="/index.html#apropos" style="font-size:12px; letter-spacing:.08em; text-transform:uppercase;">À propos</a>
        </div>
      </div>

      <div class="legal">
        <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <div>Copyright © 2026 Âmes Nomades</div>
          <div>
            <a href="/faq.html" style="display:block; text-align:right;">FAQ</a>
            <a href="/mentions-legales.html">Mentions légales</a> ·
            <a href="/politique-confidentialite.html">Politique de confidentialité</a>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script type="module">
    import { supabase } from "./assets/js/supabaseClient.js";

    const shopGrid = document.getElementById("publicShopGrid");

    async function loadShop() {
      const { data, error } = await supabase
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

      if (error || !data || data.length === 0) {
        shopGrid.innerHTML = `
          <div style="text-align:center; grid-column:1/-1; padding:40px; color:var(--muted);">
            La boutique est actuellement vide. Reviens bientôt !
          </div>
        `;
        return;
      }

      shopGrid.innerHTML = data.map(p => `
        <div class="shop-card">
          <img src="${p.image_url || '/assets/img/placeholder.jpg'}" alt="${p.name}" class="shop-image">
          <div class="shop-content">
            <h2 class="shop-title">${p.name}</h2>
            <p class="shop-desc">${p.description || ''}</p>
            <div class="shop-footer">
              <span class="shop-price">${p.price} €</span>
              ${p.stripe_url 
                ? `<a href="${p.stripe_url}" class="btn on-light" style="padding:8px 16px;">Acheter</a>` 
                : `<button class="btn" disabled>Bientôt disponible</button>`
              }
            </div>
          </div>
        </div>
      `).join('');
    }

    loadShop();
  </script>
</body>
</html>
