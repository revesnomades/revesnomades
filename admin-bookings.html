  <script type="module">
    import { supabase } from "./assets/js/supabaseClient.js";

    const adminStatus = document.getElementById("adminStatus");
    const staysAccordionList = document.getElementById("staysAccordionList");
    const searchInput = document.getElementById("searchInput");
    const filterButtons = document.querySelectorAll(".filter-btn");

    // Éléments du Modal d'Ajout
    const btnOpenAddBooking = document.getElementById("btnOpenAddBooking");
    const addBookingModal = document.getElementById("addBookingModal");
    const btnCloseAddBooking = document.getElementById("btnCloseAddBooking");
    const btnCancelAddBooking = document.getElementById("btnCancelAddBooking");
    const addBookingForm = document.getElementById("addBookingForm");
    const addStaySelect = document.getElementById("addStaySelect");
    const addBookingMsg = document.getElementById("addBookingMsg");

    let allStaysData = [];
    let orphanBookings = [];
    let currentFilter = "all";
    let currentSearch = "";

    function parseIsoDateStr(str) {
      if (!str) return null;
      const clean = String(str).substring(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(clean)) return null;
      return clean;
    }

    function formatDateRange(startRaw, endRaw, isSingleDay) {
      const start = parseIsoDateStr(startRaw);
      const end = parseIsoDateStr(endRaw);

      if (!start && !end) return "Dates à annoncer";
      
      const s = start ? new Date(start + "T00:00:00") : null;
      const e = end ? new Date(end + "T00:00:00") : null;

      if (isSingleDay || (s && (!e || start === end))) {
        const targetDate = s || e;
        if (!targetDate) return "Dates à annoncer";
        const day = targetDate.getDate();
        const month = targetDate.toLocaleDateString("fr-FR", { month: "long" });
        const year = targetDate.getFullYear();
        return `Le ${day} ${month} ${year}`;
      }
      if (!s && e) {
        const day = e.getDate();
        const month = e.toLocaleDateString("fr-FR", { month: "long" });
        const year = e.getFullYear();
        return `Le ${day} ${month} ${year}`;
      }
      if (s && e && s.getTime() === e.getTime()) {
        const day = s.getDate();
        const month = s.toLocaleDateString("fr-FR", { month: "long" });
        const year = s.getFullYear();
        return `Le ${day} ${month} ${year}`;
      }
      const sDay = s ? s.getDate() : "";
      const eDay = e ? e.getDate() : "";
      const sMonth = s ? s.toLocaleDateString("fr-FR", { month: "long" }) : "";
      const eMonth = e ? e.toLocaleDateString("fr-FR", { month: "long" }) : "";
      const sYear = s ? s.getFullYear() : "";
      const eYear = e ? e.getFullYear() : "";

      if (sMonth === eMonth && sYear === eYear) {
        return `Du ${sDay} au ${eDay} ${sMonth} ${sYear}`;
      }
      if (sYear === eYear) {
        return `Du ${sDay} ${sMonth} au ${eDay} ${eMonth} ${sYear}`;
      }
      return `Du ${sDay} ${sMonth} ${sYear} au ${eDay} ${eMonth} ${eYear}`;
    }

    function getStayStatusInfo(stay) {
      const isPublished = Boolean(stay.published);
      const stayDate = Array.isArray(stay.stay_dates) && stay.stay_dates.length > 0 ? stay.stay_dates[0] : null;
      
      let isPast = false;
      if (stayDate) {
        const endDateStr = stayDate.end_date || stayDate.start_date;
        if (endDateStr) {
          const todayStr = new Date().toISOString().split("T")[0];
          if (endDateStr < todayStr) {
            isPast = true;
          }
        }
      }

      if (!isPublished) {
        return { code: 'draft', label: 'Brouillon', prio: 2, badgeClass: 'status-badge-draft' };
      } else if (isPast) {
        return { code: 'past', label: 'Passé', prio: 3, badgeClass: 'status-badge-past' };
      } else {
        return { code: 'published', label: 'Publié', prio: 1, badgeClass: 'status-badge-published' };
      }
    }

    function cleanNorm(str) {
      if (!str) return "";
      return String(str)
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/&/g, "")
        .replace(/\band\b/g, "")
        .replace(/[^a-z0-9]/g, "")
        .trim();
    }

    function isBookingForStay(booking, stay) {
      // 1. Direct ID match
      if (booking.stay_id && booking.stay_id === stay.id) return true;

      const stayNorm = cleanNorm(stay.title);
      const staySlugNorm = cleanNorm(stay.slug);

      const bTitleNorm = cleanNorm(booking.stay_title);
      const bLabelNorm = cleanNorm(booking.price_label);

      // 2. Title & Label normalized comparison
      if (stayNorm && bTitleNorm && (bTitleNorm.includes(stayNorm) || stayNorm.includes(bTitleNorm))) {
        return true;
      }
      if (stayNorm && bLabelNorm && (bLabelNorm.includes(stayNorm) || stayNorm.includes(bLabelNorm))) {
        return true;
      }

      // 3. Slug comparison
      if (staySlugNorm && staySlugNorm.length >= 4) {
        if (bTitleNorm && (bTitleNorm.includes(staySlugNorm) || staySlugNorm.includes(bTitleNorm))) return true;
        if (bLabelNorm && (bLabelNorm.includes(staySlugNorm) || staySlugNorm.includes(bLabelNorm))) return true;
      }

      return false;
    }

    function splitCustomerName(fullName, email) {
      let name = (fullName || "").trim();
      if (!name && email) {
        const parts = email.split("@")[0].split(/[._-]/);
        if (parts.length > 1) {
          name = parts.map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(" ");
        } else {
          name = email.split("@")[0];
        }
      }
      if (!name) return { firstName: "—", lastName: "—" };
      const tokens = name.split(/\s+/);
      const firstName = tokens[0] || "—";
      const lastName = tokens.slice(1).join(" ") || "—";
      return { firstName, lastName };
    }

    async function checkAdmin(){
      const { data: { user } } = await supabase.auth.getUser();

      if(!user){
        window.location.href = "/compte.html";
        return null;
      }

      const { data, error } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      const userEmail = (user.email || "").toLowerCase();
      const isEmailAdmin = userEmail === "contact@amesnomades.com" || userEmail === "sarnelli.ap@gmail.com" || userEmail === "revesnomades@gmail.com";
      if (isEmailAdmin && data?.role !== "admin") {
        await supabase.from("profiles").update({ role: "admin" }).eq("id", user.id);
      }

      if(!isEmailAdmin && (error || data?.role !== "admin")){
        adminStatus.textContent = "Accès refusé. Vous devez être administrateur.";
        staysAccordionList.innerHTML = "";
        throw new Error("Not admin");
      }

      return user;
    }

    async function loadBookings(){
      staysAccordionList.innerHTML = `<div style="color:var(--muted); text-align:center; padding:40px;">Chargement des données...</div>`;

      // 1. Charger tous les séjours avec leurs dates
      const { data: stays, error: staysErr } = await supabase
        .from("stays")
        .select(`*, stay_dates(*)`)
        .order("created_at", { ascending: false });

      if (staysErr) {
        console.error("Erreur chargement séjours:", staysErr);
        adminStatus.textContent = "Erreur lors du chargement des séjours.";
        return;
      }

      // 2. Charger toutes les réservations
      const { data: allBookings, error: bookingsErr } = await supabase
        .from("bookings")
        .select("*")
        .order("created_at", { ascending: false });

      if (bookingsErr) console.warn("Erreur chargement réservations globales:", bookingsErr);

      const assignedBookingIds = new Set();
      const rawBookings = allBookings || [];
      const rawStays = stays || [];

      // Assigner intelligemment chaque réservation au séjour correspondant
      rawStays.forEach(stay => {
        stay.bookings = rawBookings.filter(b => {
          if (assignedBookingIds.has(b.id)) return false;
          if (isBookingForStay(b, stay)) {
            assignedBookingIds.add(b.id);
            return true;
          }
          return false;
        });
      });

      // Capturer toutes les réservations orphelines
      orphanBookings = rawBookings.filter(b => !assignedBookingIds.has(b.id));

      // 3. Trier les séjours par ordre de statut :
      // 1er : Publié (En cours / À venir)
      // 2ème : Brouillon
      // 3ème : Passé
      rawStays.sort((a, b) => {
        const prioA = getStayStatusInfo(a).prio;
        const prioB = getStayStatusInfo(b).prio;
        if (prioA !== prioB) return prioA - prioB;

        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });

      allStaysData = rawStays;

      // Mettre à jour les compteurs et afficher
      updateFilterCounts();
      renderStays();
    }

    function populateStaySelect() {
      if (!addStaySelect) return;
      addStaySelect.innerHTML = `<option value="">Sélectionner un séjour...</option>` + 
        allStaysData.map(s => `<option value="${s.id}">${s.title.toUpperCase()}</option>`).join("");
    }

    function updateFilterCounts() {
      let countAll = allStaysData.length;
      let countPublished = 0;
      let countDraft = 0;
      let countPast = 0;

      allStaysData.forEach(stay => {
        const info = getStayStatusInfo(stay);
        if (info.code === "published") countPublished++;
        else if (info.code === "draft") countDraft++;
        else if (info.code === "past") countPast++;
      });

      document.getElementById("countAll").textContent = countAll;
      document.getElementById("countPublished").textContent = countPublished;
      document.getElementById("countDraft").textContent = countDraft;
      document.getElementById("countPast").textContent = countPast;
    }

    function renderStays() {
      let filtered = allStaysData.filter(stay => {
        const info = getStayStatusInfo(stay);
        if (currentFilter === "published" && info.code !== "published") return false;
        if (currentFilter === "draft" && info.code !== "draft") return false;
        if (currentFilter === "past" && info.code !== "past") return false;

        if (currentSearch) {
          const q = currentSearch.toLowerCase();
          const matchTitle = (stay.title || "").toLowerCase().includes(q);
          const matchLoc = (stay.location || "").toLowerCase().includes(q);
          const matchClient = (stay.bookings || []).some(b => 
            (b.customer_name || "").toLowerCase().includes(q) ||
            (b.customer_email || "").toLowerCase().includes(q)
          );
          if (!matchTitle && !matchLoc && !matchClient) return false;
        }

        return true;
      });

      if (!filtered.length && !orphanBookings.length) {
        staysAccordionList.innerHTML = `<div style="background:#fff; border:1px solid var(--line); border-radius:8px; padding:30px; text-align:center; color:var(--muted);">Aucun séjour ne correspond aux critères.</div>`;
        return;
      }

      let html = filtered.map((stay) => {
        const statusInfo = getStayStatusInfo(stay);
        const stayDate = Array.isArray(stay.stay_dates) && stay.stay_dates.length > 0 ? stay.stay_dates[0] : null;
        const formattedDate = formatDateRange(stayDate?.start_date, stayDate?.end_date, stay.is_single_day);
        
        const bookings = stay.bookings || [];
        const clientCount = bookings.length;
        const titleUpper = (stay.title || "Séjour sans titre").toUpperCase();

        // Ouvrir automatiquement l'accordéon si le séjour a des clientes réservées
        const isOpenAttr = clientCount > 0 ? "open" : "";

        return `
          <details class="stay-accordion" ${isOpenAttr}>
            <summary class="stay-summary">
              <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
                <span class="status-badge ${statusInfo.badgeClass}">${statusInfo.label}</span>
                <strong style="font-family:inherit; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e1f22;">${titleUpper}</strong>
                <span style="font-size:13px; color:var(--muted); font-family:'IBM Plex Mono', monospace;">📅 ${formattedDate}</span>
              </div>

              <div style="display:flex; align-items:center; gap:16px;">
                <span class="client-badge">👥 ${clientCount} cliente${clientCount > 1 ? "s" : ""}</span>
                <span style="font-size:14px; color:var(--muted); transition:transform 0.2s;">▼</span>
              </div>
            </summary>

            <div class="accordion-content">
              ${renderClientsTable(bookings, stay)}
            </div>
          </details>
        `;
      }).join("");

      // Si réservations orphelines (hors séjours répertoriés)
      if (orphanBookings.length > 0) {
        html += `
          <details class="stay-accordion" open style="border-style:dashed;">
            <summary class="stay-summary" style="background:#faf8f2;">
              <div style="display:flex; align-items:center; gap:14px;">
                <span class="status-badge" style="background:#e2e3e5; color:#383d41;">Hors Séjour</span>
                <strong style="font-family:inherit; font-size:15px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:#1e1f22;">AUTRES RÉSERVATIONS</strong>
              </div>
              <div style="display:flex; align-items:center; gap:16px;">
                <span class="client-badge">👥 ${orphanBookings.length} cliente(s)</span>
                <span style="font-size:14px; color:var(--muted);">▼</span>
              </div>
            </summary>
            <div class="accordion-content">
              ${renderClientsTable(orphanBookings, null)}
            </div>
          </details>
        `;
      }

      staysAccordionList.innerHTML = html;

      // Re-binder les évènements de changement de statut
      attachStatusChangeEvents();
    }

    function renderClientsTable(bookings, stay) {
      if (!bookings || !bookings.length) {
        return `
          <div style="padding:16px; text-align:center; color:var(--muted); font-size:13px; background:#faf9f5; border-radius:6px;">
            Aucune réservation enregistrée pour ce séjour.
          </div>
        `;
      }

      return `
        <div style="overflow-x:auto;">
          <table class="client-table">
            <thead>
              <tr>
                <th>Prénom</th>
                <th>Nom</th>
                <th>Email</th>
                <th>Date de réservation</th>
                <th>Option / Tarif</th>
                <th>Montant / Facture</th>
                <th>Statut Réservation</th>
              </tr>
            </thead>
            <tbody>
              ${bookings.map(b => {
                const { firstName, lastName } = splitCustomerName(b.customer_name, b.customer_email);
                const bookingDate = b.created_at
                  ? new Date(b.created_at).toLocaleDateString("fr-FR", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })
                  : (b.booking_date || "—");

                const amountVal = b.amount || b.amount_paid;
                const amountStr = amountVal ? `${amountVal} €` : "—";
                const priceLabel = b.price_label || b.stay_title || "Standard";
                const status = b.status || "confirmed";

                let invoiceBtnHTML = `<span style="color:var(--muted); font-size:12px;">Payé ${amountStr}</span>`;
                if (b.stripe_session_id) {
                  invoiceBtnHTML = `
                    <a href="https://dashboard.stripe.com/payments" target="_blank" rel="noopener" 
                       style="display:inline-flex; align-items:center; gap:4px; font-size:11px; font-family:'IBM Plex Mono', monospace; background:#f0f4f8; color:#1e3a8a; border:1px solid #cbd5e1; padding:4px 8px; border-radius:4px; text-decoration:none; font-weight:600;">
                      🧾 Facture (${amountStr})
                    </a>
                  `;
                }

                return `
                  <tr>
                    <td style="font-weight:600; color:#1e1f22;">${firstName}</td>
                    <td style="font-weight:600; color:#1e1f22;">${lastName}</td>
                    <td>
                      <a href="mailto:${b.customer_email}" style="color:#2563eb; text-decoration:none;">${b.customer_email || "—"}</a>
                    </td>
                    <td style="font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--muted);">${bookingDate}</td>
                    <td style="font-size:12px;">${priceLabel}</td>
                    <td>${invoiceBtnHTML}</td>
                    <td>
                      <div style="display:flex; gap:6px; align-items:center;">
                        <select data-status-id="${b.id}" style="padding:6px 8px; font-size:12px; border:1px solid var(--line); background:#fff;">
                          <option value="confirmed" ${status === "confirmed" ? "selected" : ""}>Confirmé</option>
                          <option value="paid" ${status === "paid" ? "selected" : ""}>Payé</option>
                          <option value="pending" ${status === "pending" ? "selected" : ""}>En attente</option>
                          <option value="cancelled" ${status === "cancelled" ? "selected" : ""}>Annulé</option>
                        </select>
                        <button class="btn tiny on-light" type="button" data-save-status="${b.id}" style="padding:6px 10px; font-size:11px;">
                          💾
                        </button>
                      </div>
                    </td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    function attachStatusChangeEvents() {
      staysAccordionList.querySelectorAll("[data-save-status]").forEach(btn => {
        btn.addEventListener("click", async () => {
          const id = btn.getAttribute("data-save-status");
          const select = staysAccordionList.querySelector(`[data-status-id="${id}"]`);
          const status = select?.value || "confirmed";

          btn.textContent = "⏳";

          const { error } = await supabase
            .from("bookings")
            .update({ status })
            .eq("id", id);

          if (error) {
            console.error("Erreur maj statut:", error);
            adminStatus.textContent = "❌ Impossible de mettre à jour le statut.";
            btn.textContent = "💾";
            return;
          }

          adminStatus.textContent = "✅ Statut de la réservation mis à jour.";
          btn.textContent = "✓";
          setTimeout(() => { btn.textContent = "💾"; }, 2000);
        });
      });
    }

    // Modal d'Ajout Manuel
    if (btnOpenAddBooking) {
      btnOpenAddBooking.addEventListener("click", () => {
        populateStaySelect();
        if (addBookingMsg) addBookingMsg.textContent = "";
        if (addBookingForm) addBookingForm.reset();
        addBookingModal.style.display = "block";
      });
    }

    const closeAddModal = () => {
      addBookingModal.style.display = "none";
    };

    if (btnCloseAddBooking) btnCloseAddBooking.addEventListener("click", closeAddModal);
    if (btnCancelAddBooking) btnCancelAddBooking.addEventListener("click", closeAddModal);

    if (addBookingForm) {
      addBookingForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        const stayId = addStaySelect.value;
        const firstName = document.getElementById("addFirstName").value.trim();
        const lastName = document.getElementById("addLastName").value.trim();
        const email = document.getElementById("addEmail").value.trim();
        const priceLabel = document.getElementById("addPriceLabel").value.trim();
        const amount = Number(document.getElementById("addAmount").value || 0);
        const status = document.getElementById("addStatus").value || "confirmed";

        const selectedStay = allStaysData.find(s => s.id === stayId);
        const fullName = `${firstName} ${lastName}`.trim();

        if (addBookingMsg) {
          addBookingMsg.style.color = "#1e1f22";
          addBookingMsg.textContent = "⏳ Enregistrement de la réservation...";
        }

        const { error } = await supabase.from("bookings").insert({
          stay_id: stayId || null,
          stay_title: selectedStay ? selectedStay.title : (priceLabel || "Séjour"),
          customer_name: fullName,
          customer_email: email,
          price_label: priceLabel || (selectedStay ? selectedStay.title : "Standard"),
          amount: amount,
          amount_paid: amount,
          status: status,
          booking_date: new Date().toISOString().split("T")[0]
        });

        if (error) {
          console.error("Erreur insertion booking:", error);
          if (addBookingMsg) {
            addBookingMsg.style.color = "#c00";
            addBookingMsg.textContent = "❌ Erreur : " + error.message;
          }
          return;
        }

        if (addBookingMsg) {
          addBookingMsg.style.color = "#4f8c5b";
          addBookingMsg.textContent = "✅ Réservation ajoutée avec succès !";
        }

        setTimeout(async () => {
          closeAddModal();
          await loadBookings();
        }, 1200);
      });
    }

    // Gestionnaires de filtres
    filterButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        filterButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentFilter = btn.getAttribute("data-filter");
        renderStays();
      });
    });

    searchInput.addEventListener("input", (e) => {
      currentSearch = e.target.value.trim();
      renderStays();
    });

    try {
      await checkAdmin();
      adminStatus.textContent = "Connecté(e) en tant qu'administrateur.";
      await loadBookings();
    } catch(err) {
      console.warn(err);
    }
  </script>

</body>
</html>
