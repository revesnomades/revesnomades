  <script type="module">
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "/assets/js/supabaseClient.js?v=3";
    import { initCartBadge } from "/assets/js/cart.js?v=3";
    initCartBadge();

    const params = new URLSearchParams(location.search);
    const e = params.get("e") || "";
    const t = params.get("t") || "";
    const text = document.getElementById("unsubText");
    const btn = document.getElementById("unsubBtn");
    const msg = document.getElementById("unsubMsg");

    let email = "";
    try {
      const b64 = e.replace(/-/g, "+").replace(/_/g, "/").padEnd(Math.ceil(e.length / 4) * 4, "=");
      email = new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
    } catch {}

    if (!email.includes("@") || !t) {
      text.textContent = "Ce lien de désinscription est incomplet. Utilisez le lien « Se désinscrire » en bas de l'un de nos emails, ou écrivez-nous à contact@amesnomades.com.";
    } else {
      text.innerHTML = "";
      text.append("Vous ne recevrez plus nos emails d'actualités à l'adresse ");
      const strong = document.createElement("span");
      strong.className = "unsub-email";
      strong.textContent = email;
      text.append(strong, ".");
      btn.hidden = false;
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      msg.textContent = "Désinscription en cours…";
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/email-unsubscribe`, {
          method: "POST",
          headers: { "Content-Type": "application/json", apikey: SUPABASE_ANON_KEY, Authorization: `Bearer ${SUPABASE_ANON_KEY}` },
          body: JSON.stringify({ e, t }),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok || !data?.ok) throw new Error(data?.error || "Désinscription impossible pour le moment.");
        btn.hidden = true;
        text.textContent = "C'est fait : vous êtes désinscrit(e). Nous espérons vous revoir lors d'un prochain séjour.";
        msg.textContent = "";
      } catch (err) {
        btn.disabled = false;
        msg.textContent = err.message + " Vous pouvez aussi nous écrire à contact@amesnomades.com.";
      }
    });
  </script>
