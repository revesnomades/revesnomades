  <script type="module">
    import { supabase } from "/assets/js/supabaseClient.js";
    import { initCartBadge } from "/assets/js/cart.js";
    import { getFavorites, removeFavoritesLocally, favButtonHtml } from "/assets/js/favorites.js";

    initCartBadge();

    const content = document.getElementById("favContent");
    const sub = document.getElementById("favSub");
    const isVideo = url => /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url || "");
    const escapeHtml = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let products = [];

    function renderEmpty() {
      sub.textContent = "";
      content.innerHTML = `<div class="fav-empty">
        Vous n'avez pas encore de favoris.<br>Touchez le ♡ d'un produit pour le retrouver ici.
        <br><a href="/boutique.html" class="btn on-light">Découvrir le shop</a>
      </div>`;
    }

    function render() {
      const ids = getFavorites();
      const list = products.filter(p => ids.includes(p.id));
      if (!list.length) return renderEmpty();
      sub.textContent = `${list.length} produit${list.length > 1 ? "s" : ""} gardé${list.length > 1 ? "s" : ""} de côté.`;
      content.innerHTML = `<div class="fav-grid">${list.map(p => {
        const media = (p.image_urls && p.image_urls.length) ? p.image_urls : (p.image_url ? [p.image_url] : []);
        const img = media.find(u => !isVideo(u)) || "/assets/img/placeholder.jpg";
        const unavailable = p.coming_soon === true || p.stock === 0;
        const url = `/produit.html?id=${encodeURIComponent(p.id)}`;
        return `<div class="fav-card">
          <a href="${url}" class="fav-card-img" style="background-image:url('${encodeURI(img)}');" aria-label="${escapeHtml(p.name)}">
            ${unavailable ? `<span class="fav-card-status">Bientôt disponible</span>` : ""}
            ${favButtonHtml(p.id, "on-card")}
          </a>
          <a href="${url}" class="fav-card-name">${escapeHtml(p.name)}</a>
          <div class="fav-card-price">${(Number(p.price) || 0).toFixed(2)} €</div>
        </div>`;
      }).join("")}</div>`;
    }

    async function load() {
      const ids = getFavorites();
      if (!ids.length) { products = []; return renderEmpty(); }
      const { data, error } = await supabase
        .from("products")
        .select("id, name, price, stock, coming_soon, image_urls, image_url")
        .in("id", ids);
      if (error) {
        content.innerHTML = `<p class="fav-empty">Impossible de charger vos favoris pour le moment.</p>`;
        return;
      }
      products = data || [];
      const missing = ids.filter(id => !products.some(p => p.id === id));
      if (missing.length) removeFavoritesLocally(missing);
      render();
    }

    // Retrait d'un favori : on retire la carte sans recharger ; ajout (synchro compte) : on recharge
    window.addEventListener("favs:updated", () => {
      const ids = getFavorites();
      if (ids.some(id => !products.some(p => p.id === id))) load();
      else render();
    });

    load();
  </script>
