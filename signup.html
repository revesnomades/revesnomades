<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Créer un compte — Âmes Nomades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="96x96" href="/assets/img/favicon-96x96.png">
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="shortcut icon" href="/assets/img/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="ÂmesNomades">
  <link rel="manifest" href="/assets/img/site.webmanifest">

  <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body class="on-light">

  <section class="band cream">
    <div class="container" style="max-width:520px; padding:120px 0 60px;">
      <div class="account-card">
        <h2>Créer un compte</h2>
        <p style="color:var(--muted); margin-top:10px;">
          Créez votre compte pour suivre vos réservations et recevoir les informations liées aux séjours.
        </p>

        <div style="display:grid; gap:12px; margin-top:18px;">
          <input id="firstname" class="input"
            style="color:var(--text); background:rgba(255,255,255,.55); border:1px solid var(--line);"
            placeholder="Prénom">

          <input id="email" class="input"
            type="email"
            style="color:var(--text); background:rgba(255,255,255,.55); border:1px solid var(--line);"
            placeholder="Email">

          <div class="password-field">
            <input id="password" class="input"
              type="password"
              style="color:var(--text); background:rgba(255,255,255,.55); border:1px solid var(--line);"
              placeholder="Mot de passe">
            <button type="button" class="password-toggle" data-target="password" aria-label="Afficher le mot de passe">
              Afficher
            </button>
          </div>

          <div id="signupPasswordStrength" class="password-strength" aria-live="polite">
            <div class="password-strength-track" aria-hidden="true">
              <div id="signupPasswordStrengthFill" class="password-strength-fill"></div>
            </div>
            <p id="signupPasswordStrengthText" class="password-strength-text">Sécurité : faible</p>
            <ul class="password-hints">
              <li>Au moins 8 caractères</li>
              <li>Une majuscule</li>
              <li>Un chiffre</li>
              <li>Un caractère spécial</li>
            </ul>
          </div>

          <label style="display:flex; align-items:flex-start; gap:10px; font-size:14px; color:var(--text);">
            <input id="newsletterOptin" type="checkbox" style="margin-top:2px;">
            <span>Je souhaite aussi recevoir la newsletter Âmes Nomades et les actualités des séjours.</span>
          </label>

          <button id="btnSignup" class="btn on-light" type="button">Créer mon compte</button>

          <div id="signupMsg" style="color:var(--muted); font-size:12.5px;"></div>

          <div style="font-size:13px; color:var(--muted);">
            Vous avez déjà un compte ?
            <a href="/compte.html" style="text-decoration:underline;">Se connecter</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script type="module">
    import { supabase, SUPABASE_URL, SUPABASE_ANON_KEY } from "./assets/js/supabaseClient.js";

    const firstnameEl = document.getElementById("firstname");
    const emailEl = document.getElementById("email");
    const passwordEl = document.getElementById("password");
    const newsletterOptinEl = document.getElementById("newsletterOptin");
    const btnSignup = document.getElementById("btnSignup");
    const signupMsg = document.getElementById("signupMsg");

    function setMsg(msg){
      signupMsg.textContent = msg || "";
    }

    function getPasswordStrength(password){
      let score = 0;
      if (password.length >= 8) score += 1;
      if (/[A-Z]/.test(password)) score += 1;
      if (/[0-9]/.test(password)) score += 1;
      if (/[^A-Za-z0-9]/.test(password)) score += 1;

      if (score <= 1) return { label: "faible", color: "#cc6f53", width: "33%" };
      if (score === 2 || score === 3) return { label: "moyen", color: "#b19342", width: "66%" };
      return { label: "fort", color: "#4f8c5b", width: "100%" };
    }

    function updatePasswordStrength(){
      const fill = document.getElementById("signupPasswordStrengthFill");
      const text = document.getElementById("signupPasswordStrengthText");
      const password = passwordEl.value || "";
      const strength = getPasswordStrength(password);

      fill.style.width = password ? strength.width : "0%";
      fill.style.backgroundColor = strength.color;
      text.textContent = `Sécurité : ${password ? strength.label : "faible"}`;
    }

    function setupPasswordToggles(){
      document.querySelectorAll(".password-toggle").forEach((button) => {
        const targetId = button.getAttribute("data-target");
        const input = document.getElementById(targetId);
        if (!input) return;

        button.addEventListener("click", () => {
          const isHidden = input.type === "password";
          input.type = isHidden ? "text" : "password";
          button.textContent = isHidden ? "Masquer" : "Afficher";
          button.setAttribute("aria-label", isHidden ? "Masquer le mot de passe" : "Afficher le mot de passe");
        });
      });
    }

    // Active un affichage discret et progressif de la sécurité du mot de passe.
    passwordEl?.addEventListener("input", updatePasswordStrength);
    setupPasswordToggles();
    updatePasswordStrength();

    btnSignup?.addEventListener("click", async () => {
      setMsg("");

      const firstname = (firstnameEl.value || "").trim();
      const email = (emailEl.value || "").trim().toLowerCase();
      const password = passwordEl.value || "";
      const newsletterOptin = !!newsletterOptinEl.checked;

      if(!firstname || !email || !password){
        setMsg("Merci de renseigner votre prénom, votre email et votre mot de passe.");
        return;
      }

      // 1) Création du compte Supabase Auth
      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          emailRedirectTo: `${location.origin}/compte.html`,
          data: { firstname }
        }
      });

      if(error){
        setMsg(error.message);
        return;
      }

      const userId = data?.user?.id;

      // 2) Création / mise à jour du profil
      if(userId){
        const { error: profileError } = await supabase
          .from("profiles")
          .upsert([{
            id: userId,
            firstname,
            email
          }], { onConflict: "id" });

        if(profileError){
          console.error("PROFILE ERROR:", profileError);
        }
      }

      // 3) Si case newsletter cochée -> ajout newsletter
      if(newsletterOptin){
        try {
          const res = await fetch(`${SUPABASE_URL}/functions/v1/newsletter-signup`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_ANON_KEY,
              "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
            },
            body: JSON.stringify({
              firstname,
              email
            })
          });

          const newsletterData = await res.json().catch(() => ({}));
          console.log("Newsletter signup:", newsletterData);

        } catch (err) {
          console.error("NEWSLETTER ERROR:", err);
        }
      }

      setMsg("Compte créé. Vérifiez votre email pour confirmer votre inscription.");
    });
  </script>

</body>
</html>
