<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Âmes Nomades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>

<body>

<!-- ================= NAV ================= -->
<header class="nav">
  <div class="container nav-inner">
    <a class="brand" href="/">
      <img src="/assets/img/logo-ames-nomades.png" alt="">
      <span>ÂmesNomades</span>
    </a>

    <div class="nav-links nav-links-desktop">
      <a href="#sejours">Séjours</a>
      <a href="#apropos">À propos</a>
      <a href="compte.html">Compte</a>
    </div>
  </div>
</header>

<!-- ================= HERO ================= -->
<section id="hero" class="hero hero-left">
  <div id="heroBg" class="hero-bg"></div>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <h1 class="amesnomades-title">ÂmesNomades</h1>
    <p>Voyages immersifs et expériences uniques</p>

    <div class="actions">
      <a href="#sejours" class="btn on-photo">Découvrir</a>
    </div>
  </div>
</section>

<!-- ================= SEJOUR FEATURED ================= -->
<section id="sejours">

  <div id="featuredStay" class="stay-band stay-band-compact">
    <div id="featuredImage" class="stay-media"></div>

    <div class="stay-copy">
      <div class="kicker">Prochain séjour…</div>
      <div class="sep"></div>

      <h2 id="featuredTitle">Chargement...</h2>
      <p id="featuredDuration" class="sub"></p>
      <p id="featuredDates" class="sub"></p>

      <div class="actions">
        <a id="featuredBtn" class="btn on-light">Voir le séjour</a>
      </div>
    </div>
  </div>

</section>

<!-- ================= 5 SEJOURS ================= -->
<section class="band white">
  <div class="container">

    <div id="stayGrid" class="stay-grid"></div>

  </div>
</section>

<!-- ================= SCRIPT ================= -->
<script type="module">
import { supabase } from "/assets/js/supabaseClient.js";

/* ================= UTIL ================= */

function formatDateFR(date){
  return new Date(date).toLocaleDateString("fr-FR");
}

function getDuration(start, end){
  const s = new Date(start);
  const e = new Date(end);

  const days = Math.floor((e - s) / (1000*60*60*24)) + 1;
  const nights = days - 1;

  return `${days} jours / ${nights} nuits`;
}

/* ================= LOAD DATA ================= */

async function loadHomepage(){

  // 🔹 récupérer séjours
  const { data: stays } = await supabase
    .from("stays")
    .select("*");

  const { data: dates } = await supabase
    .from("stay_dates")
    .select("*");

  // 🔹 mapper première date
  const map = {};
  dates.forEach(d => {
    if(!map[d.stay_id]) map[d.stay_id] = d;
  });

  stays.forEach(s => {
    s.firstDate = map[s.id];
  });

  /* ================= FEATURED ================= */

  const featured = stays.find(s => s.is_featured);

  if(featured){

    document.getElementById("featuredImage").style.backgroundImage =
      `url('${featured.hero_image}')`;

    document.getElementById("featuredTitle").textContent =
      featured.title;

    if(featured.firstDate){
      document.getElementById("featuredDuration").textContent =
        getDuration(
          featured.firstDate.start_date,
          featured.firstDate.end_date
        );

      document.getElementById("featuredDates").textContent =
        formatDateFR(featured.firstDate.start_date)
        + " au " +
        formatDateFR(featured.firstDate.end_date);
    }

    document.getElementById("featuredBtn").href =
      `/sejour.html?slug=${featured.slug}`;

    // 🔹 hero dynamique
    document.getElementById("heroBg").style.backgroundImage =
      `url('${featured.hero_image}')`;
  }

  /* ================= 5 SEJOURS ================= */

  const highlights = stays
    .filter(s => s.is_highlight)
    .sort((a,b) => a.highlight_order - b.highlight_order);

  const grid = document.getElementById("stayGrid");
  grid.innerHTML = "";

  highlights.forEach(stay => {

    const duration = stay.firstDate
      ? getDuration(stay.firstDate.start_date, stay.firstDate.end_date)
      : "";

    const dates = stay.firstDate
      ? formatDateFR(stay.firstDate.start_date)
        + " - " +
        formatDateFR(stay.firstDate.end_date)
      : "";

    const el = document.createElement("a");
    el.href = `/sejour.html?slug=${stay.slug}`;
    el.className = "stay-card";

    el.innerHTML = `
      <div class="stay-card-media"
        style="background-image:url('${stay.hero_image}')">

        <div class="stay-card-overlay"></div>

        <div class="stay-card-hover">
          <div class="stay-card-line">${duration}</div>
          <div class="stay-card-dates">${dates}</div>

          <div class="stay-mini-btn">Voir</div>
        </div>
      </div>

      <div class="stay-card-title">${stay.title}</div>
    `;

    grid.appendChild(el);
  });
}

loadHomepage();

</script>

</body>
</html>
