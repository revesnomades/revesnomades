<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Âmes Nomades — Site en maintenance</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/assets/img/site.webmanifest">
  <link rel="icon" href="/assets/img/favicon.ico">

  <style>
    @font-face {
      font-family: 'SegoCustom';
      src: url('/assets/fonts/sego.woff2') format('woff2');
      font-display: swap;
    }

    :root{
      --bg:#f7f4ef;
      --card:#ffffff;
      --text:#1e1f22;
      --muted:#6c7078;
      --line:rgba(30,31,34,.14);
      --overlay:rgba(14,15,17,.36);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      min-height:100vh;
      position:relative;
      overflow-x:hidden;
    }

    .page{
      min-height:100vh;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:32px 18px;
      isolation:isolate;
    }

    .bg{
      position:fixed;
      inset:0;
      background-image:url('/assets/img/newsletter-bg.jpg');
      background-size:cover;
      background-position:center;
      z-index:-2;
      transform:scale(1.02);
    }

    .overlay{
      position:fixed;
      inset:0;
      background:linear-gradient(to bottom, rgba(14,15,17,.46), rgba(14,15,17,.54));
      z-index:-1;
    }

    .card{
      width:min(760px, 100%);
      background:rgba(255,255,255,.94);
      border:1px solid rgba(30,31,34,.12);
      backdrop-filter: blur(6px);
      padding:34px 24px 28px;
      box-shadow:0 20px 60px rgba(0,0,0,.08);
    }

    @media (min-width: 768px){
      .card{
        padding:42px 42px 34px;
      }
    }

    .brand{
      display:flex;
      align-items:center;
      gap:12px;
      text-decoration:none;
      color:var(--text);
      margin-bottom:24px;
    }

    .brand img{
      width:44px;
      height:44px;
      object-fit:contain;
      display:block;
    }

    .brand span{
      font-family:'SegoCustom', serif;
      font-size:24px;
      line-height:1;
      font-weight:500;
      letter-spacing:.01em;
    }

    h1,h2,h3{
      font-family:'SegoCustom', serif;
      font-weight:500;
      margin:0;
      letter-spacing:.01em;
    }

    h1{
      font-size:clamp(34px, 6vw, 56px);
      line-height:1.02;
    }

    .intro{
      margin-top:14px;
      color:var(--muted);
      font-size:15px;
      line-height:1.8;
      max-width:60ch;
    }

    .divider{
      width:72px;
      height:1px;
      background:var(--line);
      margin:24px 0 22px;
    }

    .subtitle{
      font-size:12px;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--muted);
      margin:0 0 10px;
    }

    .form-title{
      font-size:24px;
      line-height:1.15;
    }

    .form-text{
      margin:10px 0 0;
      color:var(--muted);
      font-size:14px;
      line-height:1.7;
      max-width:58ch;
    }

    form{
      display:grid;
      gap:12px;
      margin-top:18px;
      max-width:520px;
    }

    .input{
      width:100%;
      padding:15px 16px;
      border:1px solid rgba(30,31,34,.16);
      background:#fff;
      color:var(--text);
      font:inherit;
      border-radius:0;
      outline:none;
    }

    .input::placeholder{
      color:#8a8f97;
    }

    .input:focus{
      border-color:rgba(30,31,34,.4);
    }

    .btn{
      appearance:none;
      border:1px solid var(--text);
      background:var(--text);
      color:#fff;
      text-transform:uppercase;
      letter-spacing:.12em;
      font-size:12px;
      padding:15px 18px;
      cursor:pointer;
      transition:opacity .2s ease, transform .2s ease;
      font-family:inherit;
    }

    .btn:hover{
      opacity:.92;
    }

    .btn:active{
      transform:translateY(1px);
    }

    .msg{
      margin-top:12px;
      font-size:14px;
      line-height:1.7;
      color:var(--muted);
      min-height:24px;
    }

    .msg a{
      color:var(--text);
      text-decoration:underline;
      text-underline-offset:3px;
    }

    .bottom-note{
      margin-top:26px;
      color:var(--muted);
      font-size:12px;
      line-height:1.7;
    }

    .bottom-note strong{
      color:var(--text);
      font-weight:600;
    }

    .footer-line{
      margin-top:28px;
      padding-top:18px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      align-items:center;
      color:var(--muted);
      font-size:12px;
    }

    .footer-line a{
      color:var(--text);
      text-decoration:none;
    }

    .footer-line a:hover{
      text-decoration:underline;
    }

    .admin-secret-link{
      position:fixed;
      right:14px;
      bottom:14px;
      width:18px;
      height:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      color:rgba(255,255,255,.22);
      font-size:14px;
      z-index:60;
      transition:opacity .2s ease, transform .2s ease, color .2s ease;
      user-select:none;
    }

    .admin-secret-link:hover{
      color:rgba(255,255,255,.55);
      transform:scale(1.08);
    }
  </style>
</head>

<body>
  <main class="wrap" role="main" aria-label="Maintenance Âmes Nomades">

    <div class="top">
      <!-- ✅ Mets ton vrai logo (lien direct) -->
      <img class="logo" src="assets/img/logo-ames-nomades.png" alt="Âmes Nomades" />
      <div>
        <div class="brand">ÂmesNomades</div>
        <div class="small">Partir pour mieux se retrouver.</div>
      </div>
    </div>

    <section class="hero">
      <div>
        <h1>Le site est en maintenance 🌿</h1>
        <p>
          Nous préparons une nouvelle expérience plus fluide et plus inspirante.
          Le site revient très vite.
        </p>
        <p class="small">
          Merci pour votre patience. En attendant, vous pouvez nous écrire ou nous suivre sur Instagram.
        </p>

        <div class="row">
          <!-- ✅ Remplace par ton IG/FB -->
          <a class="btn" href="https://instagram.com/TON_COMPTE" target="_blank" rel="noopener">Instagram</a>
          <a class="btn secondary" href="mailto:amesnomades.contact@gmail.com">Nous écrire</a>
        </div>
      </div>
    </main>
  </div>

  <!-- lien discret admin -->
  <a href="/acces-admin-7k29x.html" class="admin-secret-link" aria-label="Accès admin">•</a>

  <script type="module">
    import { SUPABASE_URL, SUPABASE_ANON_KEY } from "./assets/js/supabaseClient.js";

    const form = document.getElementById("maintenanceSignupForm");
    const msg = document.getElementById("maintenanceSignupMsg");

    function show(html) {
      if (msg) msg.innerHTML = html || "";
    }

    form?.addEventListener("submit", async (e) => {
      e.preventDefault();
      show("");

      const fd = new FormData(form);
      const firstname = String(fd.get("firstname") || "").trim();
      const email = String(fd.get("email") || "").trim().toLowerCase();

      if (!firstname || !email) {
        show("Merci de renseigner votre prénom et votre email.");
        return;
      }

      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/maintenance-signup`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`
          },
          body: JSON.stringify({ firstname, email })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          console.warn("maintenance-signup error:", data);
          show("Oups… impossible de vous enregistrer pour le moment. Réessayez dans un instant.");
          return;
        }

        show("🌿 Merci, vous êtes bien inscrit(e) à la newsletter et prioritaire pour le prochain séjour.");
        form.reset();
      } catch (err) {
        console.error(err);
        show("Oups… impossible de vous enregistrer pour le moment. Réessayez dans un instant.");
      }
    });
  </script>
</body>
</html>
