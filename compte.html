<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Mon compte — Âmes Nomades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="stylesheet" href="/assets/css/styles.css" />
</head>
<body class="on-light">

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="/index.html">
        <img src="/assets/img/logo-ames-nomades.png" alt="Âmes Nomades" width="40" height="40">
        <span>ÂmesNomades</span>
      </a>
    </div>
  </header>

  <main>
    <section class="band cream">
      <div class="account-section">
        <div class="container account-grid">

          <div class="account-card">
            <div id="welcomeName" style="font-size:22px; margin-bottom:10px; display:none;"></div>
            <h2>Mon compte</h2>

            <div id="authBox" style="margin-top:16px;">
              <div style="display:grid; gap:10px;">
                <input id="email" class="input" type="email"
                  placeholder="Email" autocomplete="email"
                  style="color:var(--text); background:rgba(255,255,255,.55); border:1px solid var(--line);">

                <div class="password-field">
                  <input id="password" class="input" type="password"
                    placeholder="Mot de passe" autocomplete="current-password"
                    style="color:var(--text); background:rgba(255,255,255,.55); border:1px solid var(--line);">
                  <button type="button" id="togglePassword"
                    style="position:absolute; right:12px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:var(--muted); font-size:13px;">
                    Afficher
                  </button>
                </div>

                <div style="display:flex; gap:10px; flex-wrap:wrap;">
                  <button class="btn on-light" id="btnLogin" type="button">Connexion</button>
                  <a class="btn on-light" href="/signup.html">Inscription</a>
                </div>

                <button class="btn on-light" id="btnForgot" type="button"
                  style="justify-content:flex-start;">
                  Mot de passe oublié ?
                </button>

                <div id="authMsg" style="color:var(--muted); font-size:12.5px;"></div>
              </div>
            </div>

            <div id="resetBox" style="display:none; margin-top:16px;">
              <h3 style="font-weight:500; margin:0;">Nouveau mot de passe</h3>
              <div style="display:grid; gap:10px; margin-top:10px;">
                <input id="newPassword" class="input" type="password"
                  placeholder="Nouveau mot de passe"
                  style="color:var(--text); background:rgba(255,255,255,.55); border:1px solid var(--line);">
                <button class="btn on-light" id="btnUpdatePassword" type="button">
                  Mettre à jour
                </button>
                <div id="resetMsg" style="color:var(--muted); font-size:12.5px;"></div>
              </div>
            </div>

            <div id="loggedBox" style="display:none; margin-top:16px;">
              <div style="color:var(--muted); font-size:13px;">
                Connecté(e) : <b id="userEmail"></b>
              </div>
              <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
                <button class="btn on-light" id="btnLogout" type="button">Déconnexion</button>
              </div>
              <div id="loggedMsg" style="margin-top:10px; color:var(--muted); font-size:12.5px;"></div>

              <div id="adminPanel" style="display:none; margin-top:20px; border-top:1px solid var(--line); padding-top:16px;">
                <h3 style="margin:0;">Espace admin</h3>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:14px;">
                  <button class="btn on-light" id="btnManageStays" type="button">⚙️ Séjours</button>
                  <button class="btn on-light" id="btnAdminBookings" type="button">📊 Réservations</button>
                  <button class="btn on-light" id="btnPriorityList" type="button">⭐ Prioritaires</button>
                  <button class="btn on-light" id="btnNewsletterList" type="button">✉️ Newsletter</button>
                </div>
              </div>
            </div>
          </div>

          <div>
            <div id="perksBox" class="account-card">
              <h3 style="font-weight:500; margin:0;">Pourquoi créer un compte ?</h3>
              <p style="color:var(--muted); margin-top:10px;">
                • Suivre vos réservations<br>
                • Voir les places restantes<br>
                • Recevoir les informations pratiques
              </p>
            </div>
          </div>

        </div>
      </div>
    </section>
  </main>

  <footer class="band cream">
    <div class="container footer">
      <div class="legal">
        <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;">
          <div>Copyright © 2026 Âmes Nomades</div>
          <div>
            <a href="/mentions-legales.html">Mentions légales</a> ·
            <a href="/politique-confidentialite.html">Politique de confidentialité</a>
          </div>
        </div>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js" defer></script>

  <script type="module">
    import { supabase } from "/assets/js/supabaseClient.js";

    const emailEl    = document.getElementById("email");
    const passEl     = document.getElementById("password");
    const btnLogin   = document.getElementById("btnLogin");
    const btnLogout  = document.getElementById("btnLogout");
    const btnForgot  = document.getElementById("btnForgot");
    const btnUpdate  = document.getElementById("btnUpdatePassword");
    const btnManage  = document.getElementById("btnManageStays");
    const btnBookings= document.getElementById("btnAdminBookings");
    const btnPriority= document.getElementById("btnPriorityList");
    const btnNewsletter = document.getElementById("btnNewsletterList");
    const togglePass = document.getElementById("togglePassword");

    const authBox    = document.getElementById("authBox");
    const resetBox   = document.getElementById("resetBox");
    const loggedBox  = document.getElementById("loggedBox");
    const perksBox   = document.getElementById("perksBox");
    const adminPanel = document.getElementById("adminPanel");
    const welcomeName= document.getElementById("welcomeName");
    const userEmail  = document.getElementById("userEmail");

    const authMsg    = document.getElementById("authMsg");
    const resetMsg   = document.getElementById("resetMsg");
    const loggedMsg  = document.getElementById("loggedMsg");

    function setMsg(el, txt){ if(el) el.textContent = txt || ""; }

    function showLoggedOut(){
      if(authBox)    authBox.style.display    = "block";
      if(resetBox)   resetBox.style.display   = "none";
      if(loggedBox)  loggedBox.style.display  = "none";
      if(perksBox)   perksBox.style.display   = "block";
      if(adminPanel) adminPanel.style.display = "none";
      if(welcomeName){ welcomeName.style.display = "none"; welcomeName.textContent = ""; }
      document.cookie = "an_admin_session=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Lax";
    }

    async function showLoggedIn(user){
      if(authBox)   authBox.style.display   = "none";
      if(resetBox)  resetBox.style.display  = "none";
      if(loggedBox) loggedBox.style.display = "block";
      if(perksBox)  perksBox.style.display  = "none";
      if(userEmail) userEmail.textContent   = user.email || "";

      const hour = parseInt(new Intl.DateTimeFormat("fr-FR",{
        timeZone:"Europe/Paris", hour:"numeric", hour12:false
      }).format(new Date()), 10);
      const salutation = (hour >= 4 && hour < 20) ? "Bonjour" : "Bonsoir";

      const { data: profile } = await supabase
        .from("profiles").select("role, firstname").eq("id", user.id).single();

      const firstname = user.user_metadata?.firstname || profile?.firstname || "";
      const isAdmin   = profile?.role === "admin";

      if(welcomeName){
        welcomeName.textContent   = firstname ? `${salutation} ${firstname} ✨` : `${salutation} ✨`;
        welcomeName.style.display = "block";
      }

      if(isAdmin){
        if(adminPanel) adminPanel.style.display = "block";
        const exp = new Date(Date.now() + 8*60*60*1000).toUTCString();
        document.cookie = `an_admin_session=1; path=/; expires=${exp}; SameSite=Lax`;
      }
    }

    // Toggle password
    togglePass?.addEventListener("click", () => {
      const hidden = passEl.type === "password";
      passEl.type  = hidden ? "text" : "password";
      togglePass.textContent = hidden ? "Masquer" : "Afficher";
    });

    // Connexion
    btnLogin?.addEventListener("click", async () => {
      setMsg(authMsg, "");
      const email    = (emailEl?.value || "").trim();
      const password = passEl?.value || "";
      if(!email || !password){
        setMsg(authMsg, "Merci de renseigner un email et un mot de passe.");
        return;
      }
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });
      if(error){ setMsg(authMsg, error.message); return; }
      await showLoggedIn(data.user);
    });

    // Mot de passe oublié
    btnForgot?.addEventListener("click", async () => {
      setMsg(authMsg, "");
      const email = (emailEl?.value || "").trim();
      if(!email){ setMsg(authMsg, "Renseignez votre email."); return; }
      const { error } = await supabase.auth.resetPasswordForEmail(email, {
        redirectTo: `${location.origin}/compte.html`
      });
      if(error){ setMsg(authMsg, error.message); return; }
      setMsg(authMsg, "Lien envoyé. Vérifiez votre boîte email.");
    });

    // Mise à jour mot de passe
    btnUpdate?.addEventListener("click", async () => {
      setMsg(resetMsg, "");
      const pw = (document.getElementById("newPassword")?.value || "").trim();
      if(!pw || pw.length < 8){ setMsg(resetMsg, "Minimum 8 caractères."); return; }
      const { error } = await supabase.auth.updateUser({ password: pw });
      if(error){ setMsg(resetMsg, error.message); return; }
      setMsg(resetMsg, "Mot de passe mis à jour.");
      setTimeout(() => { resetBox.style.display="none"; authBox.style.display="block"; }, 2000);
    });

    // Déconnexion
    btnLogout?.addEventListener("click", async () => {
      await supabase.auth.signOut();
      showLoggedOut();
    });

    // Navigation admin
    btnManage?.addEventListener("click",    () => { window.location.href = "/admin-stays.html"; });
    btnBookings?.addEventListener("click",  () => { window.location.href = "/admin-bookings.html"; });
    btnPriority?.addEventListener("click",  () => { window.location.href = "/admin-priority.html"; });
    btnNewsletter?.addEventListener("click",() => { window.location.href = "/admin-newsletter.html"; });

    // Détection reset password
    const hash = window.location.hash || "";
    const isRecovery = hash.includes("type=recovery") || hash.includes("access_token");
    if(isRecovery){
      if(authBox)  authBox.style.display  = "none";
      if(resetBox) resetBox.style.display = "block";
    } else {
      const { data: { session } } = await supabase.auth.getSession();
      if(session?.user) await showLoggedIn(session.user);
      else showLoggedOut();
    }

    // Sync auth state
    supabase.auth.onAuthStateChange(async (_evt, session) => {
      if(session?.user) await showLoggedIn(session.user);
      else showLoggedOut();
    });
  </script>

</body>
</html>
