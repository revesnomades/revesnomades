<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Admin Shop — Âmes Nomades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/assets/img/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/assets/img/apple-touch-icon.png">
  <link rel="manifest" href="/assets/img/site.webmanifest">
  <link rel="icon" href="/assets/img/favicon.ico">
  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 20px;
    }
    .product-card {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.55);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: var(--line);
      border-radius: 4px;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: var(--white);
      padding: 24px;
      border-radius: 8px;
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
    }
  </style>
</head>

<body class="on-light">

  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="/index.html">
        <img src="/assets/img/logo-ames-nomades.png" alt="Âmes Nomades">
        <span>Âmes Nomades</span>
      </a>
      <div class="nav-links nav-links-desktop">
        <a href="/boutique.html">Shop</a><a href="/compte.html">Compte</a>
        <a href="/admin-dashboard.html">Admin</a>
      </div>
    </div>
  </header>

  <section class="band cream">
    <div class="container" style="padding:120px 0 60px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <h1 style="margin:0;">Gestion du Shop</h1>
          <p style="color:var(--muted); margin-top:10px;">
            Ajoute ou modifie les produits (e-books, tapis, etc.) de ton Shop.
          </p>
        </div>
        <button class="btn on-light" id="btnAddProduct">Ajouter un produit</button>
      </div>

      <div id="adminStatus" style="margin-top:14px; color:var(--muted); font-size:12.5px;"></div>

      <div style="margin-top:30px; margin-bottom:20px; border-top:1px solid var(--line); padding-top:20px;">
        <h2 style="font-size:20px; margin:0 0 14px 0;">Catégories</h2>
        <div style="display:flex; gap:10px; margin-bottom:14px;">
          <input id="newCategoryName" class="input" placeholder="Nouvelle catégorie" style="max-width:300px;">
          <button class="btn on-light" id="btnAddCategory">Ajouter</button>
        </div>
        <div id="categoriesList" style="display:flex; flex-wrap:wrap; gap:10px;">
          <span style="color:var(--muted); font-size:14px;">Chargement des catégories...</span>
        </div>
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; margin-top:40px; margin-bottom:20px;">
        <h2 style="font-size:20px; margin:0;">Produits</h2>
      </div>

      <div class="product-grid" id="productsList">
        <p>Chargement des produits...</p>
      </div>
    </div>
  </section>

  <!-- Modal d'édition / création -->
  <div class="modal" id="productModal">
    <div class="modal-content">
      <h2 id="modalTitle">Nouveau produit</h2>
      <form id="productForm" style="display:grid; gap:14px; margin-top:16px;">
        <input type="hidden" id="productId">
        
        <div>
          <label class="muted-small" style="display:block; margin-bottom:6px;">Nom du produit</label>
          <input id="productName" class="input" required>
        </div>

        <div>
          <label class="muted-small" style="display:block; margin-bottom:6px;">Description courte</label>
          <textarea id="productDescription" class="input" rows="3"></textarea>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label class="muted-small" style="display:block; margin-bottom:6px;">Prix (€)</label>
            <input id="productPrice" type="number" step="0.01" class="input" required>
          </div>
          <div>
            <label class="muted-small" style="display:block; margin-bottom:6px;">Type (optionnel)</label>
            <select id="productType" class="input">
              <option value="physique">Physique (Tapis, Gourde...)</option>
              <option value="numerique">Numérique (E-book)</option>
            </select>
          </div>
        </div>

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
          <div>
            <label class="muted-small" style="display:block; margin-bottom:6px;">Catégorie</label>
            <select id="productCategory" class="input">
              <option value="">Sélectionnez une catégorie...</option>
            </select>
          </div>
          <div>
            <label class="muted-small" style="display:block; margin-bottom:6px;">Stock (vide = illimité)</label>
            <input id="productStock" type="number" class="input" placeholder="Ex: 10">
          </div>
        </div>

        <div>
          <label class="muted-small" style="display:block; margin-bottom:6px;">Délai de livraison / note</label>
          <input id="productDelivery" class="input" placeholder="Ex : Expédié sous 3 à 5 jours ouvrés">
        </div>

        <div>
          <label class="muted-small" style="display:block; margin-bottom:6px;">Photos (sélectionnez la principale avec le bouton 🔘)</label>
          <div id="imagesContainer" style="display:grid; gap:8px; margin-bottom:8px;"></div>
          <button type="button" class="btn tiny on-light" id="btnAddImageField">+ Ajouter une photo</button>
        </div>

        <div>
          <label class="muted-small" style="display:block; margin-bottom:6px;">Lien Stripe (Lien de paiement)</label>
          <input id="productStripeUrl" class="input" placeholder="https://buy.stripe.com/...">
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:10px;">
          <button type="button" class="btn" id="btnCancel" style="background:transparent; border:1px solid var(--line);">Annuler</button>
          <button type="submit" class="btn on-light">Enregistrer</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from "./assets/js/supabaseClient.js";

    const adminStatus = document.getElementById("adminStatus");
    const productsList = document.getElementById("productsList");
    const productModal = document.getElementById("productModal");
    const productForm = document.getElementById("productForm");
    const btnAddProduct = document.getElementById("btnAddProduct");
    const btnCancel = document.getElementById("btnCancel");

    // Form inputs
    const fId = document.getElementById("productId");
    const fName = document.getElementById("productName");
    const fDesc = document.getElementById("productDescription");
    const fPrice = document.getElementById("productPrice");
    const fType = document.getElementById("productType");
    const fCategory = document.getElementById("productCategory");
    const fStock = document.getElementById("productStock");
    const fDelivery = document.getElementById("productDelivery");
    const fStripe = document.getElementById("productStripeUrl");
    const imagesContainer = document.getElementById("imagesContainer");
    const btnAddImageField = document.getElementById("btnAddImageField");

    // Category inputs
    const btnAddCategory = document.getElementById("btnAddCategory");
    const newCategoryName = document.getElementById("newCategoryName");
    const categoriesList = document.getElementById("categoriesList");
    window.allCategories = [];

    async function checkAdmin(){
      const { data: { user } } = await supabase.auth.getUser();
      if(!user){
        window.location.href = "/compte.html";
        return null;
      }
      const { data, error } = await supabase.from("profiles").select("role").eq("id", user.id).single();
      if(error || data?.role !== "admin"){
        adminStatus.textContent = "Accès refusé. Vous devez être administrateur.";
        throw new Error("Not admin");
      }
      return user;
    }

    async function loadCategories() {
      const { data, error } = await supabase.from("product_categories").select("*").order("name", { ascending: true });
      if (error) {
        // Table might not exist yet
        categoriesList.innerHTML = "<span style='color:var(--muted);'>Catégories non disponibles (la table n'existe peut-être pas encore).</span>";
        return;
      }
      
      window.allCategories = data || [];
      
      if (window.allCategories.length === 0) {
        categoriesList.innerHTML = "<span style='color:var(--muted);'>Aucune catégorie.</span>";
      } else {
        categoriesList.innerHTML = window.allCategories.map(c => `
          <div style="display:flex; align-items:center; gap:6px; background:var(--bg-main); padding:6px 12px; border-radius:20px; border:1px solid var(--line); font-size:13.5px;">
            ${c.name}
            <button class="btn tiny" style="background:transparent; color:#c00; padding:0 4px;" onclick="deleteCategory('${c.id}')">✕</button>
          </div>
        `).join('');
      }

      // Populate select
      fCategory.innerHTML = '<option value="">Sélectionnez une catégorie...</option>' + 
        window.allCategories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
    }

    window.deleteCategory = async (id) => {
      if(!confirm("Supprimer cette catégorie définitivement ? Les produits liés perdront leur catégorie.")) return;
      await supabase.from("product_categories").delete().eq("id", id);
      await loadCategories();
      await loadProducts();
    };

    btnAddCategory.addEventListener("click", async () => {
      const name = newCategoryName.value.trim();
      if(!name) return;
      
      const { error } = await supabase.from("product_categories").insert({ name });
      if(error) {
        alert("Erreur lors de l'ajout de la catégorie : " + error.message);
      } else {
        newCategoryName.value = "";
        await loadCategories();
      }
    });

    async function loadProducts() {
      const { data, error } = await supabase.from("products").select("*").order("created_at", { ascending: false });
      if (error) {
        adminStatus.textContent = "Erreur lors du chargement des produits.";
        return;
      }
      
      if (!data || data.length === 0) {
        productsList.innerHTML = "<p>Aucun produit dans la boutique pour le moment.</p>";
        return;
      }

      productsList.innerHTML = data.map(p => {
        const cat = window.allCategories.find(c => c.id === p.category_id);
        const catLabel = cat ? ` · ${cat.name}` : '';
        const stockLabel = p.stock === 0 ? " · <strong style='color:#c00;'>SOLD OUT</strong>" : (p.stock != null ? ` · Stock: ${p.stock}` : "");
        const imgSrc = (p.image_urls && p.image_urls[0]) || p.image_url || '/assets/img/placeholder.jpg';
        return `
        <div class="product-card">
          <img src="${imgSrc}" alt="${p.name}" class="product-image">
          <h3 style="margin:0; font-size:18px;">${p.name}</h3>
          <p style="margin:0; color:var(--muted); font-size:14px;">${p.price} € - ${p.type}${catLabel}${stockLabel}</p>
          <div style="display:flex; gap:8px; margin-top:auto;">
            <button class="btn tiny on-light" onclick="editProduct('${p.id}')">Modifier</button>
            <button class="btn tiny" style="background:#ffdddd; color:#c00;" onclick="deleteProduct('${p.id}')">Supprimer</button>
          </div>
        </div>
        `;
      }).join('');

      window.allProducts = data;
    }

    function renderImageFields(urls = ['']){
      if(!urls || !urls.length) urls = [''];
      imagesContainer.innerHTML = urls.map((url, i) => `
        <div style="display:flex; gap:8px; align-items:center;" class="img-field-row">
          <input type="radio" name="mainImgRadio" value="${i}" ${i === 0 ? 'checked' : ''} title="Choisir comme image principale">
          <input type="text" class="input img-url-input" value="${url}" placeholder="https://..." style="flex:1;">
          <button type="button" class="btn tiny" onclick="this.parentElement.remove()" style="background:transparent; color:#c00;">✕</button>
        </div>
      `).join('');
    }

    btnAddImageField?.addEventListener("click", () => {
      const idx = imagesContainer.children.length;
      const div = document.createElement("div");
      div.style.cssText = "display:flex; gap:8px; align-items:center;";
      div.className = "img-field-row";
      div.innerHTML = `
        <input type="radio" name="mainImgRadio" value="${idx}" ${idx === 0 ? 'checked' : ''} title="Choisir comme image principale">
        <input type="text" class="input img-url-input" placeholder="https://..." style="flex:1;">
        <button type="button" class="btn tiny" onclick="this.parentElement.remove()" style="background:transparent; color:#c00;">✕</button>
      `;
      imagesContainer.appendChild(div);
    });

    window.editProduct = (id) => {
      const product = window.allProducts.find(p => p.id == id);
      if(!product) return;
      document.getElementById("modalTitle").textContent = "Modifier le produit";
      fId.value = product.id;
      fName.value = product.name;
      fDesc.value = product.description || "";
      fPrice.value = product.price;
      fType.value = product.type || "physique";
      fCategory.value = product.category_id || "";
      fStock.value = product.stock != null ? product.stock : "";
      fDelivery.value = product.delivery_info || "";
      fStripe.value = product.stripe_url || "";
      
      const imgs = product.image_urls && product.image_urls.length ? product.image_urls : (product.image_url ? [product.image_url] : ['']);
      renderImageFields(imgs);

      productModal.classList.add("active");
    };

    window.deleteProduct = async (id) => {
      if(!confirm("Supprimer ce produit définitivement ?")) return;
      await supabase.from("products").delete().eq("id", id);
      loadProducts();
    };

    btnAddProduct.addEventListener("click", () => {
      document.getElementById("modalTitle").textContent = "Nouveau produit";
      productForm.reset();
      fId.value = "";
      renderImageFields(['']);
      productModal.classList.add("active");
    });

    btnCancel.addEventListener("click", () => {
      productModal.classList.remove("active");
    });

    productForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      
      const nameVal = fName.value.trim();
      const priceVal = parseFloat(fPrice.value);
      if (!nameVal || isNaN(priceVal)) {
        alert("Veuillez renseigner au minimum un nom et un prix valide pour le produit.");
        return;
      }

      // Gather image URLs
      const rows = Array.from(imagesContainer.querySelectorAll(".img-field-row"));
      let urls = [];
      let mainIdx = 0;
      rows.forEach((row, i) => {
        const val = row.querySelector(".img-url-input").value.trim();
        const radio = row.querySelector("input[name='mainImgRadio']");
        if(val){
          if(radio && radio.checked) mainIdx = urls.length;
          urls.push(val);
        }
      });
      if(urls.length > 1 && mainIdx > 0){
        const mainUrl = urls.splice(mainIdx, 1)[0];
        urls.unshift(mainUrl);
      }

      const payload = {
        name: nameVal,
        description: fDesc.value.trim() || null,
        price: priceVal,
        type: fType.value || "physique",
        category_id: fCategory.value || null,
        stock: fStock.value === "" ? null : parseInt(fStock.value, 10),
        delivery_info: fDelivery.value.trim() || null,
        image_urls: urls.length ? urls : null,
        image_url: urls[0] || null,
        stripe_url: fStripe.value.trim() || null
      };

      let resError = null;
      if (fId.value) {
        const { error } = await supabase.from("products").update(payload).eq("id", fId.value);
        resError = error;
      } else {
        const { error } = await supabase.from("products").insert([payload]);
        resError = error;
      }
      
      if (resError) {
        alert("❌ Erreur lors de l'enregistrement du produit :\n\n" + resError.message + "\n\n⚠️ Si vous voyez une erreur de sécurité (RLS), exécutez le script SQL fourni pour autoriser l'ajout de produits !");
        return;
      }

      productModal.classList.remove("active");
      await loadProducts();
    });

    checkAdmin().then(async user => {
      if(user) {
        await loadCategories();
        await loadProducts();
      }
    });
  </script>
</body>
</html>
