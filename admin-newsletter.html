<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Newsletter — Âmes Nomades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://qxrxwgrgjvesevjkjmry.supabase.co">
  <link rel="dns-prefetch" href="https://qxrxwgrgjvesevjkjmry.supabase.co">
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body class="on-light">

  <section class="band cream">
    <div class="container" style="padding:120px 0 60px;">
      <div class="account-card" style="max-width:1180px; margin:0 auto;">
        <div style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center;">
          <div>
            <h1 style="margin:0;">Inscrits newsletter</h1>
            <p style="color:var(--muted); margin-top:10px;">Toutes les personnes inscrites via le guide ou d’autres formulaires newsletter.</p>
          </div>
          <a class="btn on-light" href="/compte.html">Retour dashboard</a>
        </div>

        <div id="newsletterList" style="margin-top:24px;">Chargement…</div>
      </div>
    </div>
  </section>

  <script type="module">
    import { supabase } from "./assets/js/supabaseClient.js";

    const newsletterList = document.getElementById("newsletterList");

    async function checkAdmin(){
      const { data: { user } } = await supabase.auth.getUser();
      if(!user){
        window.location.href = "/compte.html";
        return null;
      }

      const { data, error } = await supabase
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();

      if(error || data?.role !== "admin"){
        throw new Error("Not admin");
      }

      return user;
    }

    function escapeHtml(value){
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    async function loadNewsletter(){
      const { data, error } = await supabase
        .from("newsletter")
        .select("*")
        .order("created_at", { ascending: false });

      if(error){
        console.error(error);
        newsletterList.textContent = "Impossible de charger la liste.";
        return;
      }

      if(!data?.length){
        newsletterList.textContent = "Aucun inscrit newsletter.";
        return;
      }

      newsletterList.innerHTML = `
        <div style="display:grid; gap:10px;">
          ${data.map(item => `
            <div style="border:1px solid var(--line); background:rgba(255,255,255,.55); padding:14px;">
              <div style="font-weight:600;">${escapeHtml(item.name || item.firstname || "—")}</div>
              <div style="margin-top:4px; color:var(--muted);">${escapeHtml(item.email)}</div>
              <div style="margin-top:4px; font-size:12px; color:var(--muted);">
                Inscription : ${item.created_at ? new Date(item.created_at).toLocaleString("fr-FR") : "—"}
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    try{
      await checkAdmin();
      await loadNewsletter();
    } catch(err){
      console.warn(err);
      window.location.href = "/compte.html";
    }
  </script>

</body>
</html>
