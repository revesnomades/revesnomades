<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Réinitialiser mon mot de passe — Âmes Nomades</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>

<body class="on-light">

  <section class="band cream">
    <div class="container reveal" data-delay="0" style="max-width:520px; text-align:center;">

      <h1 style="margin-bottom:10px;">Nouveau mot de passe</h1>

      <p class="sub" style="margin-bottom:26px;">
        Choisissez un nouveau mot de passe pour votre compte.
      </p>

      <form id="resetForm" style="display:grid; gap:14px;">

        <div class="password-field">
          <input
            type="password"
            id="password"
            placeholder="Nouveau mot de passe"
            required
            style="padding:12px; border:1px solid var(--line); background:#fff;"
          />
          <button type="button" class="password-toggle" data-target="password" aria-label="Afficher le mot de passe">
            Afficher
          </button>
        </div>

        <div id="resetPasswordStrength" class="password-strength" aria-live="polite">
          <div class="password-strength-track" aria-hidden="true">
            <div id="resetPasswordStrengthFill" class="password-strength-fill"></div>
          </div>
          <p id="resetPasswordStrengthText" class="password-strength-text">Sécurité : faible</p>
          <ul class="password-hints">
            <li>Au moins 8 caractères</li>
            <li>Une majuscule</li>
            <li>Un chiffre</li>
            <li>Un caractère spécial</li>
          </ul>
        </div>

        <div class="password-field">
          <input
            type="password"
            id="confirmPassword"
            placeholder="Confirmer le mot de passe"
            required
            style="padding:12px; border:1px solid var(--line); background:#fff;"
          />
          <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Afficher le mot de passe de confirmation">
            Afficher
          </button>
        </div>

        <button type="submit" class="btn on-light">
          Enregistrer le nouveau mot de passe
        </button>

      </form>

      <p id="msg" class="small muted" style="margin-top:16px;"></p>

    </div>
  </section>

  <script type="module">
    import { supabase } from "/assets/js/supabaseClient.js";

    const form = document.getElementById("resetForm");
    const msg = document.getElementById("msg");

    function setMsg(text, isError = false){
      msg.textContent = text;
      msg.style.color = isError ? "#c0392b" : "#6c7078";
    }

    function getPasswordStrength(password){
      let score = 0;
      if (password.length >= 8) score += 1;
      if (/[A-Z]/.test(password)) score += 1;
      if (/[0-9]/.test(password)) score += 1;
      if (/[^A-Za-z0-9]/.test(password)) score += 1;

      if (score <= 1) return { label: "faible", color: "#cc6f53", width: "33%" };
      if (score === 2 || score === 3) return { label: "moyen", color: "#b19342", width: "66%" };
      return { label: "fort", color: "#4f8c5b", width: "100%" };
    }

    function updatePasswordStrength(){
      const password = document.getElementById("password").value || "";
      const fill = document.getElementById("resetPasswordStrengthFill");
      const text = document.getElementById("resetPasswordStrengthText");
      const strength = getPasswordStrength(password);

      fill.style.width = password ? strength.width : "0%";
      fill.style.backgroundColor = strength.color;
      text.textContent = `Sécurité : ${password ? strength.label : "faible"}`;
    }

    function setupPasswordToggles(){
      document.querySelectorAll(".password-toggle").forEach((button) => {
        const targetId = button.getAttribute("data-target");
        const input = document.getElementById(targetId);
        if (!input) return;

        button.addEventListener("click", () => {
          const isHidden = input.type === "password";
          input.type = isHidden ? "text" : "password";
          button.textContent = isHidden ? "Masquer" : "Afficher";
          button.setAttribute("aria-label", isHidden ? "Masquer le mot de passe" : "Afficher le mot de passe");
        });
      });
    }

    document.getElementById("password")?.addEventListener("input", updatePasswordStrength);
    setupPasswordToggles();
    updatePasswordStrength();

    // IMPORTANT : récupérer la session depuis le lien Supabase
    const { data, error } = await supabase.auth.getSession();

    if (error || !data.session) {
      setMsg("Lien invalide ou expiré. Veuillez refaire une demande.", true);
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = document.getElementById("password").value.trim();
      const confirm = document.getElementById("confirmPassword").value.trim();

      if(password.length < 6){
        setMsg("Mot de passe trop court (min. 6 caractères).", true);
        return;
      }

      if(password !== confirm){
        setMsg("Les mots de passe ne correspondent pas.", true);
        return;
      }

      setMsg("Mise à jour en cours…");

      const { error: updateError } = await supabase.auth.updateUser({
        password: password
      });

      if(updateError){
        console.error(updateError);
        setMsg("Erreur lors de la mise à jour du mot de passe.", true);
        return;
      }

      setMsg("Mot de passe mis à jour avec succès.");

      // redirection après succès
      setTimeout(() => {
        window.location.href = "/compte.html";
      }, 2000);
    });
  </script>

</body>
</html>
